jdk:
  - openjdk17
before_install:
  - SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SDK" ] || SDK=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1); yes | "$SDK" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
install:
  - ./gradlew clean publishToMavenLocal -x test
